[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deepagents-workbench"
version = "0.1.0"
description = "A resumable coding-agent service built on Deep Agents, with a durable tool journal and fault-injection evaluation."
requires-python = ">=3.12"
dependencies = [
  "deepagents==0.7.32",
  "langgraph-checkpoint-sqlite>=3.0,<4",
  "langchain-openai>=1.0,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.35,<1",
  "python-dotenv>=1,<2",
  "filelock>=3.16,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[project.scripts]
harness = "harness_workbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_workbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

